<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Developer AOP tracke New r</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F5F6F8;--card:#FFFFFF;--ink:#18202C;--mute:#5E6878;--line:#E2E5EA;--aop:#E25F00;--aop-soft:#FFF1E6;--non:#2F5D8A;--non-soft:#EAF1F8;--hover:#F1F3F6;--good:#1F7A4D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--card:#1A2028;--ink:#E8ECF1;--mute:#9AA4B2;--line:#2C3440;--aop:#FF8A3D;--aop-soft:#3A2414;--non:#7FB0E0;--non-soft:#17283A;--hover:#222A34;--good:#5CC890}}
:root[data-theme="dark"]{--bg:#12161C;--card:#1A2028;--ink:#E8ECF1;--mute:#9AA4B2;--line:#2C3440;--aop:#FF8A3D;--aop-soft:#3A2414;--non:#7FB0E0;--non-soft:#17283A;--hover:#222A34;--good:#5CC890}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.src{color:var(--mute);font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
input[type=search]{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;white-space:nowrap;border:0;background:none;color:var(--mute);padding:8px 14px;cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);font-weight:600}
.reset{font:inherit;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;text-align:left;font:inherit;color:inherit;border-top:4px solid var(--c)}
.side[aria-pressed=true]{outline:2px solid var(--c);outline-offset:-1px}
.side.aop{--c:var(--aop)}.side.non{--c:var(--non)}
.side h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--mute)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:4px 0 6px}
.bar i{display:block;height:100%}
.share{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:16px;font-size:12.5px;color:var(--mute)}
.share .row{display:grid;grid-template-columns:90px 1fr 190px;gap:10px;align-items:center}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;gap:8px}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-h small{color:var(--mute)}
.tw{overflow-x:auto;max-height:640px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--card);font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;user-select:none;z-index:1}
th[data-dir]::after{content:attr(data-dir);margin-left:4px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px}
.tag.a{background:var(--aop-soft);color:var(--aop)}.tag.n{background:var(--non-soft);color:var(--non)}
.mini{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--aop)}
.detail{position:sticky;top:12px}
.main.solo{grid-template-columns:minmax(0,1fr)}.main.solo .detail{display:none}
.empty{padding:28px 18px;color:var(--mute)}
.dhead{padding:16px 18px 6px}
.dhead h3{margin:0 0 4px;font-size:18px;font-weight:700}
.aopbox{margin:10px 18px;padding:14px;border-radius:10px;background:var(--aop-soft)}
.aopbox h4{margin:0 0 8px;font-size:14px;color:var(--aop)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-top:10px}
.kv span{color:var(--mute)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 18px 12px}
.dstats div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.dstats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.dstats span{font-size:11.5px;color:var(--mute)}
.citylink{background:none;border:0;padding:0;font:inherit;color:var(--non);text-decoration:underline;cursor:pointer}
.inf{font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:0 5px;white-space:nowrap}
.ladder{margin-top:16px}
.lad{position:relative;height:34px;margin:8px 0 2px}
.lad .track{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:4px;background:var(--line)}
.lad .fill{position:absolute;left:0;top:13px;height:8px;border-radius:4px;background:var(--aop)}
.lad .mk{position:absolute;top:6px;width:2px;height:22px;background:var(--ink)}
.lad .mk.t{background:var(--non)}
.lad .mk.s{background:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.maxed{color:var(--good);font-weight:600}
.basis{font-size:11px;color:var(--mute)}
.perf{margin-bottom:16px}
.pk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 16px 12px}
.pk div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pk b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pk span{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.pbar{position:relative;width:80px;height:8px;border-radius:4px;background:var(--line);display:inline-block;vertical-align:middle;margin-right:6px}
.pbar i{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:var(--aop)}
.pbar u{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink)}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.act{white-space:normal;min-width:170px;text-align:left!important;color:var(--mute);font-size:12.5px}
.upl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--mute)}
.upl input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.upl label.btn{border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink);background:var(--card)}
@media (max-width:760px){.pk{grid-template-columns:repeat(2,1fr)}}
.note{color:var(--mute);font-size:12px;margin-top:16px;max-width:900px}
:focus-visible{outline:2px solid var(--aop);outline-offset:2px}
@media (max-width:980px){.main{grid-template-columns:1fr}.detail{position:static}.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.split{grid-template-columns:1fr}.share .row{grid-template-columns:70px 1fr}.share .row em{display:none}}
</style>
</head>

function perfOf(a){
 const now=new Date(S.asof),s=toDate(a.start),e=toDate(a.end);
 const o={a,stat:'',f:null,pace:null,need:null,ratio:null,proj:null,revNow:0,revProj:0,revNext:null,mLeft:null};
 if(basisOf(a)==='unit'){o.stat='unit';return o}
 if(!s||!e)return{...o,stat:'noslab'};
 const span=e-s,done=Math.min(Math.max(now-s,0),span);o.f=span?done/span:0;
 const mDone=done/DAY/30.44;o.mLeft=Math.max((e-now)/DAY/30.44,0);
 const cur=a.curAV||0,nx=a.nextAV||0,hasNext=nx>0&&!isMax(a.rawNextAV);
 o.pace=mDone>0?cur/mDone:0;o.proj=o.f>0?cur/o.f:cur;
 o.revNow=cur*(a.curBrok||0)/100;
 const rate=x=>hasNext&&x>=nx?(a.nextBrok||0):(a.curBrok||0);
 o.revProj=o.proj*rate(o.proj)/100;
 if(hasNext){o.revNext=nx*(a.nextBrok||0)/100;o.need=o.mLeft>0?Math.max(nx-cur,0)/o.mLeft:null;o.ratio=o.pace>0&&o.need!=null?o.need/o.pace:null}
 o.tPct=a.target?cur/a.target:null;
 if(cur===0)o.stat='zero';
 else if(!hasNext)o.stat='noslab';
 else if(o.proj>=nx)o.stat='track';
 else if(o.proj>=0.9*nx)o.stat='edge';
 else if(o.ratio!=null&&o.ratio<=3&&o.revNext>=1)o.stat='risk';
 else if(o.ratio!=null&&o.ratio<=3)o.stat='push';
 else o.stat='out';

function parseAOP(text){
 const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)throw new Error('The file has no AOP rows.');
 const sep=lines[0].includes('\t')?'\t':',';
 const split=l=>{if(sep==='\t')return l.split('\t');const o=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o};
 const hdr=split(lines[0]).map(h=>h.trim());const need=['ID','Name of AOP','Start Date','End Date','Current AV (INR Cr)','Next Slab AV (INR Cr)'];
 const miss=need.filter(h=>!hdr.includes(h));if(miss.length)throw new Error('Missing column: '+miss.join(', '));
 const num=v=>{v=(v||'').trim();if(v===''||v==='-'||/SLAB/i.test(v))return null;const x=+v;return isNaN(x)?null:x};
 const known=new Set(P.map(p=>p.dev));
 return lines.slice(1).map(l=>{const r=split(l),g=k=>{const i=hdr.indexOf(k);return i<0?'':(r[i]||'').trim()};
  const name=g('Name of AOP'),brand=name.replace(/\s*FY\s*\d\d-\d\d/i,'').trim();const id=+g('ID');
  const norm=d=>{const x=toDate(d);return x?String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear():d};
  return{sr:+g('Sr. No.'),id,name,brand,start:norm(g('Start Date')),end:norm(g('End Date')),curSlab:g('Current AV Achieved Slab (INR Cr)'),uCurSlab:g('Current Achieved Slab (Unit)'),uCur:g('Current Unit'),uCurBrok:g('Current Unit Brokerage %'),uNext:g('Next Slab Unit'),uNextReq:g('Next Slab Unit Required'),uNextBrok:g('Next Slab Unit Brokerage %'),uTarget:g('Target(unit)'),rawAV:g('Current AV (INR Cr)'),rawNextAV:g('Next Slab AV (INR Cr)'),
   curAV:num(g('Current AV (INR Cr)')),target:num(g('Target(Av)')),curBrok:num(g('Current Brokerage %')),nextAV:num(g('Next Slab AV (INR Cr)')),nextReq:num(g('Next Slab AV Required')),nextBrok:num(g('Next Slab Brokerage %')),builderId:+g('Builder ID'),codes:g('Project Codes').split('/').filter(Boolean).length,
   devs:(AOP_MAP[id]||AOP_BRAND[brand]||[]).filter(d=>known.has(d))}}).filter(a=>a.name)}

 ${ps.map(p=>`<tr style="cursor:default"><td style="white-space:normal;min-width:160px">${esc(p.name)}${p.inf?' <span class="inf" title="Developer was blank in MIS; matched from project name">matched by name</span>':''}</td><td><button class="citylink" data-city="${esc(p.city)}">${esc(p.city)}</button></td><td>${inr(p.ns)}</td><td>${inr(p.tc)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No projects for this developer in the selected city.</td></tr>'}
 </tbody></table></div>`;
}

const setView=v=>{S.view=(S.view===v&&v!=='all')?'all':v;render()};
document.querySelectorAll('.filters .seg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
document.querySelectorAll('.side').forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.getElementById('city').onchange=e=>{S.city=e.target.value;render()};
document.getElementById('q').oninput=e=>{S.q=e.target.value;render()};
[...document.getElementById('tgt').options].forEach(o=>{if(!o.value)return;const keep=S.tgt;S.tgt=o.value;o.textContent+=` (${D.aops.filter(tgtOk).length})`;S.tgt=keep});
document.getElementById('tgt').onchange=e=>{S.tgt=e.target.value;render()};
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.stat=b.dataset.s;render()});
document.getElementById('asof').onchange=e=>{if(e.target.value){S.asof=e.target.value;render()}};
document.querySelectorAll('#ptabs button').forEach(b=>b.onclick=()=>{S.ptab=b.dataset.p;render()});
const perfT=document.getElementById('perf');const pickP=tr=>{if(tr&&tr.dataset.city){S.city=tr.dataset.city;document.getElementById('city').value=S.city;S.ptab='proj';render();return}if(!tr||!tr.dataset.dev)return;S.sel=tr.dataset.dev;render();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})};
perfT.addEventListener('click',e=>pickP(e.target.closest('tr')));perfT.addEventListener('keydown',e=>{if(e.key==='Enter')pickP(e.target.closest('tr'))});
document.getElementById('aopFile').onchange=e=>{const f=e.target.files[0];const msg=document.getElementById('uplMsg');if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const aops=parseAOP(rd.result);D.aops=aops;rebuildMap();S.aopFile=f.name;const m=f.name.match(/(\d{4}-\d{2}-\d{2})/);if(m)S.asof=m[1];
  document.getElementById('src').textContent='Sales & cost: Daily ROI report, '+D.meta.snapshot+' · AOP: '+f.name;
  const unm=aops.filter(a=>!a.devs.length).map(a=>a.name);msg.style.color='var(--good)';msg.textContent='Loaded '+aops.length+' AOPs'+(unm.length?' · not linked to MIS: '+unm.join(', '):'');render()}
  catch(err){msg.style.color='#C0392B';msg.textContent='Could not read '+f.name+': '+err.message}};rd.readAsText(f);e.target.value=''};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.sort='ns';S.dir=-1;render()});
document.getElementById('reset').onclick=()=>{Object.assign(S,{city:'',view:'all',q:'',sel:null,tgt:'',stat:''});document.getElementById('tgt').value='';document.getElementById('city').value='';document.getElementById('q').value='';render()};
const tbl=document.getElementById('tbl');
const pick=tr=>{if(tr&&tr.dataset.city){S.city=tr.dataset.city;document.getElementById('city').value=S.city;S.tab='proj';S.sort='ns';S.dir=-1;render();return}if(!tr||!tr.dataset.dev)return;S.sel=tr.dataset.dev;render();if(innerWidth<980)document.getElementById('detail').scrollIntoView({behavior:'smooth'})};
const sortBy=th=>{const k=th.dataset.k;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=['dev','city','name','aopName'].includes(k)?1:-1}render()};
tbl.addEventListener('click',e=>{const th=e.target.closest('th');if(th)return sortBy(th);pick(e.target.closest('tr'))});
tbl.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const th=e.target.closest('th');if(th)return sortBy(th);pick(e.target.closest('tr'))});
const lad=document.getElementById('lad');
const pickL=tr=>{if(!tr||!tr.dataset.dev)return;S.sel=tr.dataset.dev;render();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})};
lad.addEventListener('click',e=>pickL(e.target.closest('tr')));lad.addEventListener('keydown',e=>{if(e.key==='Enter')pickL(e.target.closest('tr'))});
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='closeDet'){S.sel=null;render();return}const b=e.target.closest('.citylink');if(b){S.city=b.dataset.city;document.getElementById('city').value=S.city;render()}});
document.getElementById('note').textContent='AOP developers are matched from the AOP file by exact developer name, because the MIS data has no project codes yet. 1,519 MIS projects had a blank developer; 790 were matched from the project name (tagged “matched by name”), and the rest sit under “Developer not set”. Totals are cumulative figures from the Daily ROI report; AOP AV comes from the AOP file and may be on a different date. Projects tagged city "Remove" are excluded.';
render();
</script>
